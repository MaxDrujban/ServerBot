services:
  serverbot:
    build: .
    container_name: serverbot-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/telegram/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s